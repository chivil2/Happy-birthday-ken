<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leave a Tribute for Ken</title>
  <meta name="description" content="Sign the scroll — add a birthday message for Ken's 20th" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Caveat:wght@500;700&family=Karla:wght@300;400;700&family=Special+Elite&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="wish-page">
    <div class="wish-wrap">
      <div class="wish-paper">
        <h1 class="wish-page-title">Leave a Tribute for Ken</h1>
        <p class="wish-page-script">the youngest of the group turns twenty — sign the scroll</p>

        <form class="wish-form" id="wishForm">
          <input
            type="text"
            id="wishName"
            maxlength="40"
            placeholder="your name"
            required
            autocomplete="name"
          />
          <textarea
            id="wishMessage"
            maxlength="280"
            rows="3"
            placeholder="your birthday message for ken..."
            required
          ></textarea>

          <label class="photo-drop" for="wishPhoto" id="photoDrop">
            + attach a portrait (optional)
          </label>
          <input type="file" id="wishPhoto" accept="image/*" hidden />
          <div class="photo-preview" id="photoPreview">
            <img id="previewImg" alt="Your photo" />
            <button type="button" id="photoRemove" aria-label="Remove photo">&times;</button>
          </div>

          <div class="wish-form-row">
            <span class="char-count" id="charCount">0 / 280</span>
            <button type="submit" class="wish-submit" id="wishSubmit">seal &amp; send</button>
          </div>
          <p class="wish-status" id="wishStatus"></p>
        </form>

        <a class="wish-back" href="/">&larr; back to ken's page</a>
      </div>
    </div>
  </div>

  <script src="wish.js"></script>
</body>
</html>
